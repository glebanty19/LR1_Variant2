title: "Оцінювання пошкоджень будівель кварталу м. Рубіжне"
project: "LR1_Варіант2"
author: "Бондар Гліб Ігорович, група КНм-26-1"
version: 1
date: "2026-11-05"

object: "Будівлі житлового кварталу м. Рубіжне після обстрілів; вибраний фрагмент ≈0,53 км²"
decision:
  user: "Уповноважений підрозділ цивільного захисту громади"
  period: "Щотижня; перший огляд через 1–3 доби після події"
  cost_of_errors: "Пропуск зруйнованої будівлі дорожчий за зайвий виїзд; пріоритет — повнота виявлення"

indicator: "M̂ = Σ Aᵢ·nᵢ·q·Σₖ Pᵢₖ·fₖ, т; цільова похибка ≤ 30 %"

research_question: "Чи дає донавчання xBD на українських мітках приріст recall (major + destroyed) щонайменше на 0.10 проти zero-shot моделі?"
hypothesis: "Донавчання підвищує recall щонайменше на 10 відсоткових пунктів відносно zero-shot моделі xBD."

task:
  type: "Локалізація будівель, класифікація пошкоджень і сегментація завалів"
  classes: [no_damage, minor, major, destroyed, debris_heap, background]
  formalization: >-
    x_i = (I_pre, I_post, B_i) ∈ X; ŷ_i = f_θ(x_i) = (c_i, M_i) ∈ Y;
    d_i = g(ŷ_i, context_i), де c_i — клас пошкодження
    будівлі, M_i — маска завалу, а d_i — пріоритет обстеження/розбору.
    Класи будівель: no_damage, minor, major, destroyed.

data:
  sources: [xBD Ukraine (Rubizhne), UNOSAT, Maxar Open Data, Sentinel-1/2, OSM, Microsoft, Overture]
  gsd_required_m: "≤ 0.3–0.5 м для детального аналізу будівель; Sentinel-2 10 м — лише скринінг"
  license: "Картка xBD Ukraine на Hugging Face декларує MIT; атрибутувати набір і перевіряти права на першоджерела перед повторним використанням."
  inspected_scene:
    dataset: "xBD Ukraine Destruction Analysis"
    url: "https://huggingface.co/datasets/sda-kr/xbd-ukraine"
    image: "ukraine_sample/images/rubizhne_post_0003.png"
    labels: "ukraine_sample/labels/rubizhne_post_0003.json"
    event_phase: "post-event; paired pre-event tile is included"
    acquired: "Не зазначено в метаданих доступного фрагмента"
    crs: "EPSG:32637, відновлено за координатами вершин анотацій"
    georeference_method: "Affine fit між 538 парами піксельних та географічних вершин; RMS залишок 0.0048 м"
    gsd_m: "X=0.575; Y=0.874 (розраховано за геоприв'язаними анотаціями)"
    dimensions: "1024×1024 пкс; приблизно 0.588×0.895 км"
  measured_target_objects: 5
  usable_labeled_samples_by_class:
    no_damage: 75
    minor: 3
    major: 4
    destroyed: 3
    debris_heap: 0
  sample_count_note: >-
    Кількість з анотацій після події у вибраному PNG-чіпі; це мітки набору,
    а не незалежна наземна перевірка. Окремого класу куп завалу немає.
  acquisition_date_limit: >-
    Точну дату отримання знімків не вдалося встановити: PNG та JSON набору
    містять лише фазу pre/post, назву чіпа й координати анотацій.

metrics:
  recall_major_destroyed: "≥ 0.85"
  precision_major_destroyed: "≥ 0.50"
  macro_f1: "≥ 0.60"
  mass_error: "≤ 30 %"
  baseline: "Zero-shot модель на xBD; числові результати ще не отримані."

plan:
  - "ЛР2: отримати дозволені VHR-знімки та відповідні українські мітки; перевірити ліцензії й узгодження дат."
  - "ЛР3: сформувати розмітку, розділити дані за територіями й оцінити базову zero-shot модель."
  - "ЛР4: донавчити модель, оцінити метрики на незалежній території та проаналізувати помилки й похибку маси."

risks:
  - risk: "У доступному xBD Ukraine фрагменті не вказана точна дата знімання."
    mitigation: "Зберегти це як обмеження джерела; не вигадувати дату та за потреби запросити продукт із повними метаданими."
  - risk: "Мітки UNOSAT можуть бути попередніми й неповними."
    mitigation: "Фіксувати версію продукту та статус валідації; перевіряти вибірку незалежними джерелами."
  - risk: "Можливий доменний зсув між xBD та українськими даними."
    mitigation: "Оцінювати окремо на українській території та звітувати про метрики по класах."
  - risk: "Хмарність і тіні ускладнюють аналіз оптичних знімків."
    mitigation: "Перевіряти маску хмар і метадані; використовувати часові пари та SAR для скринінгу."
  - risk: "Геоприв'язка цього PNG відновлена з полігонів анотацій, а не отримана з оригінального GeoTIFF."
    mitigation: "Використовувати похідний GeoTIFF лише для огляду й вимірювання цього фрагмента; для точного картографування отримати оригінальний продукт."
  - risk: "Параметри q та fₖ не відкалібровані для місцевих конструкцій."
    mitigation: "Не трактувати оцінку маси як виміряну; калібрувати її за інженерними даними та наземними обстеженнями."
  - risk: "Мітки xBD Ukraine є анотаціями набору, не незалежною наземною валідацією."
    mitigation: "Зазначати походження міток і не використовувати їх як доказ точності моделі без незалежної перевірки."

reproducibility:
  seed: 42
  python: "≥ 3.10"
  github_account: "https://github.com/glebanty19"
  repository: "https://github.com/glebanty19/LR1_Variant2"
