title: "Оцінювання пошкоджень будівель житлового кварталу м. Ірпінь"
project: "LR1_Варіант2"
author: "Бондар Гліб Ігорович, група КНм-26-1"
version: 1
date: "2026-11-05"

object: "Будівлі та завали житлового кварталу м. Ірпінь, орієнтовно 1 км²"
decision:
  user: "Підрозділ Ірпінської міської військової адміністрації або виконкому з питань цивільного захисту"
  period: "Щотижня; перший огляд через 1–3 доби після події"
  cost_of_errors: "Пропуск зруйнованої будівлі дорожчий за зайвий виїзд; пріоритет — повнота виявлення"

indicator: "M̂ = Σ Aᵢ·nᵢ·q·Σₖ Pᵢₖ·fₖ, т; цільова похибка ≤ 30 %"

research_question: "Чи дає донавчання xBD на українських мітках приріст recall (major + destroyed) щонайменше на 0.10 проти zero-shot моделі?"
hypothesis: "Донавчання підвищує recall щонайменше на 10 відсоткових пунктів відносно zero-shot моделі xBD."

task:
  type: "Локалізація будівель, класифікація пошкоджень і сегментація завалів"
  classes: [no_damage, minor, major, destroyed, debris_heap, background]
  formalization: >-
    x_i = (I_pre, I_post, B_i) ∈ X; ŷ_i = f_θ(x_i) = (c_i, M_i) ∈ Y;
    d_i = g(ŷ_i, context_i), де c_i — клас пошкодження
    будівлі, M_i — маска завалу, а d_i — пріоритет обстеження/розбору.
    Класи будівель: no_damage, minor, major, destroyed.

data:
  sources: [xBD, UNOSAT, Maxar Open Data, Sentinel-1/2, OSM, Microsoft, Overture]
  gsd_required_m: "≤ 0.3–0.5 м для детального аналізу будівель; Sentinel-2 10 м — лише скринінг"
  license: "Перевіряти ліцензії кожного набору; використовувати дані лише в дозволених цілях"
  inspected_scene:
    file: "irpin_sentinel2_20220415.tif"
    stac_item: "S2B_MSIL2A_20220415T090549_R050_T36UUB_20240617T181011"
    acquired: "2022-04-15T09:05:49Z"
    crs: "EPSG:32636"
    gsd_m: "10.294 × 10.374 (лише для контекстного огляду)"
  vhr_status: "Відкритий VHR-знімок Ірпеня потрібної дати не отримано; окремі будівлі не виміряні."
  measured_target_objects: 0
  usable_labeled_samples_by_class:
    no_damage: 0
    minor: 0
    major: 0
    destroyed: 0
    debris_heap: 0
  sample_count_note: >-
    Для Sentinel-2 окремі будівлі й завали не розрізняються; нуль означає
    нуль придатних для перевіреної розмітки зразків у цій вирізці, а не
    відсутність таких об'єктів на місцевості.

metrics:
  recall_major_destroyed: "≥ 0.85"
  precision_major_destroyed: "≥ 0.50"
  macro_f1: "≥ 0.60"
  mass_error: "≤ 30 %"
  baseline: "Zero-shot модель на xBD; числові результати ще не отримані."

plan:
  - "ЛР2: отримати дозволені VHR-знімки та відповідні українські мітки; перевірити ліцензії й узгодження дат."
  - "ЛР3: сформувати розмітку, розділити дані за територіями й оцінити базову zero-shot модель."
  - "ЛР4: донавчити модель, оцінити метрики на незалежній території та проаналізувати помилки й похибку маси."

risks:
  - risk: "Відкриті VHR-знімки потрібних дат можуть бути недоступні."
    mitigation: "Перевіряти каталоги Maxar Open Data та Copernicus EMS; погодити з викладачем альтернативний датасет або доступ до знімків."
  - risk: "Мітки UNOSAT можуть бути попередніми й неповними."
    mitigation: "Фіксувати версію продукту та статус валідації; перевіряти вибірку незалежними джерелами."
  - risk: "Можливий доменний зсув між xBD та українськими даними."
    mitigation: "Оцінювати окремо на українській території та звітувати про метрики по класах."
  - risk: "Хмарність і тіні ускладнюють аналіз оптичних знімків."
    mitigation: "Перевіряти маску хмар і метадані; використовувати часові пари та SAR для скринінгу."
  - risk: "Sentinel-2 із роздільністю 10 м недостатньо деталізований для окремих будівель."
    mitigation: "Застосовувати його лише для скринінгу; не вимірювати будівлі до отримання VHR-даних."
  - risk: "Параметри q та fₖ не відкалібровані для місцевих конструкцій."
    mitigation: "Не трактувати оцінку маси як виміряну; калібрувати її за інженерними даними та наземними обстеженнями."

reproducibility:
  seed: 42
  python: "≥ 3.10"
  github_account: "https://github.com/glebanty19"
  repository: "https://github.com/glebanty19/LR1_Variant2"
